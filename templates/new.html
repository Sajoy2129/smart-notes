{% extends "layout.html" %}

{% block title %}New note – Smart Notes{% endblock %}

{% block content %}
<h1>New note</h1>

{% if error %}
  <p class="alert" role="alert">{{ error }}</p>
{% endif %}

<form class="card form" method="post" id="note-form">
  <label for="title">Title</label>
  <input id="title" name="title" value="{{ title }}" required
         placeholder="e.g. Site visit – Harbour Road">

  <label for="body">Note</label>
  <textarea id="body" name="body" rows="12" required
            placeholder="Type your rough notes here…">{{ body }}</textarea>

  <div class="form-actions">
    <button class="button" type="submit">Save</button>
    <span class="saving" hidden><span class="spinner"></span> Claude is reading your note…</span>
  </div>
</form>

<script>
  // Saving waits for Claude, which can take a few seconds. Show a spinner and stop
  // double clicks. "submit" only fires once the required fields are filled in.
  document.getElementById("note-form").addEventListener("submit", function () {
    this.querySelector("button").disabled = true;
    this.querySelector(".saving").hidden = false;
  });
</script>
{% endblock %}
